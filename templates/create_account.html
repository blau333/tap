<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tap — аккаунт подтверждён</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #F5F3FF;
    --card: #FFFFFF;
    --ink: #1A1330;
    --muted: #8A83A6;
    --violet: #6D4AFF;
    --violet-dark: #5636E0;
    --coral: #FF6B4A;
    --mint: #22C58B;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0; min-height:100vh;
    background: var(--bg);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ink);
  }

  body{
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding: 32px 20px;
    position:relative; overflow-x:hidden;
  }

  .field{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
  }
  .field svg{ width: min(900px, 140vw); height: auto; opacity:0.6; }
  .field circle{ fill:none; stroke: var(--mint); stroke-opacity:0.16; }
  .field .r1{ animation: ripple 6s ease-out infinite; }
  .field .r2{ animation: ripple 6s ease-out infinite 2s; }
  .field .r3{ animation: ripple 6s ease-out infinite 4s; }
  @keyframes ripple{
    0%   { r: 40;  stroke-opacity:0.35; }
    100% { r: 420; stroke-opacity:0; }
  }

  .card{
    position:relative; z-index:1;
    width:100%; max-width: 440px;
    background: var(--card);
    border-radius: 28px;
    padding: 44px 36px 36px;
    box-shadow: 0 1px 2px rgba(26,19,48,0.04), 0 24px 60px -20px rgba(26,19,48,0.18);
    text-align:center;
  }

  .wordmark{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'Space Grotesk', sans-serif; font-weight:700;
    font-size: 15px; letter-spacing: 0.02em;
    color: var(--violet-dark); margin-bottom: 30px;
  }
  .wordmark .dot{ width:8px; height:8px; border-radius:50%; background: var(--coral); display:inline-block; }

  .glyph{
    width: 84px; height: 84px; margin: 0 auto 26px;
    position:relative; display:flex; align-items:center; justify-content:center;
  }
  .glyph svg{ width:100%; height:100%; }
  .glyph .ring{ fill:none; stroke: var(--mint); stroke-width: 1.6; opacity:0.35; }
  .glyph .core{ fill: var(--mint); }
  .glyph .check{
    stroke: #fff; stroke-width: 2.4; fill:none;
    stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 20; stroke-dashoffset: 20;
    animation: draw 0.5s ease-out 0.3s forwards;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-size: 23px; font-weight:600; line-height:1.3;
    margin: 0 0 12px; letter-spacing: -0.01em;
  }

  p.sub{ margin: 0 0 30px; font-size: 15px; line-height:1.55; color: var(--muted); }
  p.sub .handle{ font-weight:600; color: var(--ink); }

  .cta{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding: 14px 18px;
    border-radius: 14px; border:none;
    background: var(--violet); color:#fff;
    font-family:'Inter', sans-serif; font-size: 15px; font-weight:600;
    text-decoration:none; cursor:pointer;
    transition: background .15s ease, transform .15s ease;
  }
  .cta:hover{ background: var(--violet-dark); transform: translateY(-1px); }
  .cta:active{ transform: translateY(0); }
  .cta:focus-visible{ outline: 2px solid var(--violet-dark); outline-offset: 2px; }

  .footnote{ margin-top: 26px; font-size: 12px; color: #B4AFCB; line-height:1.5; }

  @media (max-width: 380px){
    .card{ padding: 36px 22px 28px; border-radius: 22px; }
  }

  @media (prefers-reduced-motion: reduce){
    .field .r1, .field .r2, .field .r3{ animation: none; }
    .glyph .check{ animation: none; stroke-dashoffset:0; }
  }
</style>
</head>
<body>

  <div class="field" aria-hidden="true">
    <svg viewBox="0 0 400 400">
      <circle class="r1" cx="200" cy="200" r="40"/>
      <circle class="r2" cx="200" cy="200" r="40"/>
      <circle class="r3" cx="200" cy="200" r="40"/>
    </svg>
  </div>

  <main class="card">
    <div class="wordmark"><span class="dot"></span>tap</div>

    <div class="glyph" aria-hidden="true">
      <svg viewBox="0 0 84 84">
        <circle class="ring" cx="42" cy="42" r="30"/>
        <circle class="core" cx="42" cy="42" r="22"/>
        <path class="check" d="M32 43 L39 50 L53 34"/>
      </svg>
    </div>

    <h1>Аккаунт подтверждён</h1>
    <p class="sub">Готово! <span class="handle">{{ handle }}</span> теперь можно пользоваться tap на полную.</p>

    <a class="cta" href="/app">Перейти в tap →</a>

    <p class="footnote">Если это были не вы — смените пароль в настройках безопасности.</p>
  </main>

</body>
</html>
