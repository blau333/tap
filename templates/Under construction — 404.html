<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tap — under construction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Inter:wght@300;400;800&display=swap" rel="stylesheet">
<style>
  :root {
    --outer: #f1f2f8;
    --card: #242424;
    --ink: #ffffff;
    --soft: #e6e6e6;
    --rule: #8a8a8a;
    --accent: #8fe3f0;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--outer);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 11px clamp(0px, 3.6vw, 32px);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .card {
    width: 100%;
    max-width: 828px;
    background: var(--card);
    color: var(--ink);
  }
  .hero {
    padding: clamp(24px, 6vw, 46px) clamp(20px, 7vw, 60px) clamp(24px, 4vw, 48px);
    border-bottom: 1px solid var(--rule);
  }
  .hero svg { display: block; width: 100%; height: auto; }
  .hero text {
    font-family: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
    font-weight: 900;
    fill: var(--ink);
  }
  .hero rect { fill: var(--ink); }
  .hero .logo-fill { fill: url(#logo-shine); }
  @media (prefers-reduced-motion: reduce) {
    .logo-shine animate { display: none; }
  }
  .info { padding: 28px clamp(20px, 7vw, 60px) 24px; }
  .brand {
    margin: 0;
    font-size: 8px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
    background: linear-gradient(90deg, var(--accent), #fff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .oops {
    margin: 12px 0 0;
    font-size: 24px;
    font-weight: 300;
    color: var(--soft);
  }
  .oops b { font-weight: 800; }
  .msg {
    margin: 36px 0 0;
    text-align: right;
    font-size: 21px;
    font-weight: 300;
    color: var(--soft);
  }
  @media (max-width: 520px) {
    .oops { font-size: 20px; }
    .msg { font-size: 17px; margin-top: 28px; }
  }
</style>
</head>
<body>
  <main class="card">
    <header class="hero">
      <svg viewBox="0 0 708 215" role="img" aria-label="Under construction">
        <defs>
          <linearGradient id="logo-shine" gradientUnits="userSpaceOnUse" x1="-150" y1="0" x2="-30" y2="0">
            <stop offset="0%" stop-color="#fff"/>
            <stop offset="43%" stop-color="#fff"/>
            <stop offset="50%" stop-color="#bdf8ff"/>
            <stop offset="57%" stop-color="#fff"/>
            <stop offset="100%" stop-color="#fff"/>
            <animate attributeName="x1" from="-150" to="738" dur="1.6s" fill="freeze"/>
            <animate attributeName="x2" from="-30" to="858" dur="1.6s" fill="freeze"/>
          </linearGradient>
        </defs>
        <text class="logo-fill" x="0" y="148" font-size="195" textLength="708" lengthAdjust="spacingAndGlyphs">UNDER</text>
        <text class="logo-fill" x="0" y="214" font-size="82" textLength="505" lengthAdjust="spacingAndGlyphs">CONSTRUCT</text>
        <rect class="logo-fill" x="512" y="161" width="45" height="53"/>
        <text class="logo-fill" x="566" y="214" font-size="82" textLength="142" lengthAdjust="spacingAndGlyphs">ON</text>
      </svg>
    </header>
    <section class="info">
      <p class="brand">tap</p>
      <p class="oops">oops<b>...</b></p>
      <p class="msg">this page doesnt exist</p>
    </section>
  </main>
</body>
</html>
