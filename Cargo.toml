[package]
name = "kolo"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "set-header"] }
sqlx = { version = "0.7", features = ["mysql", "runtime-tokio-rustls", "chrono"] }
askama = "0.12"
askama_axum = "0.4"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
base32 = "0.4"
qrcode = { version = "0.13", features = ["svg"] }
rand = "0.8"
async-trait = "0.1"
base64 = "0.21"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls-tls"] }
webauthn-rs = "0.5"
url = "2"
# Vendored OpenSSL only for the windows-gnu target (no system OpenSSL there).
# Linux/macOS keep the system OpenSSL via pkg-config (see Dockerfile libssl-dev).
[target.'cfg(all(windows, target_env = "gnu"))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
